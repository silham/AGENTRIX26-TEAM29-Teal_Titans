# HelpLK AI — Coolify / docker-compose deployment.
#
# Uses an EXTERNAL Postgres + pgvector database (e.g. Supabase or Neon free
# tier — see DATABASE_URL below) rather than running Postgres in this stack.
#
# In Coolify: create a new "Docker Compose" resource pointing at this repo,
# then set the variables below (Coolify → Environment Variables) before the
# first deploy. After deploy, assign a domain to `frontend` (port 3000) and,
# if the backend should be reachable directly (docs, admin API), to `backend`
# (port 8000) as well — then set NEXT_PUBLIC_BACKEND_URL / FRONTEND_ORIGIN to
# those real domains and redeploy, since NEXT_PUBLIC_BACKEND_URL is baked into
# the frontend's client bundle at build time.
#
# Required env vars (see .env.example):
#   DATABASE_URL, AUTH_SECRET, FRONTEND_ORIGIN, NEXT_PUBLIC_BACKEND_URL
# Optional: ADMIN_EMAILS, GROQ_API_KEY, GEMINI_API_KEY

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your external Postgres+pgvector connection string}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET — must match the frontend's AUTH_SECRET}
      JWT_ALGORITHM: HS256
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN to the public frontend URL}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_BUCKET: documents
      STORAGE_DIR: /app/storage
    volumes:
      - backend_storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?set NEXT_PUBLIC_BACKEND_URL to the PUBLIC backend URL reachable from the browser}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET — must match the backend's AUTH_SECRET}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    expose:
      - "3000"

volumes:
  backend_storage:
